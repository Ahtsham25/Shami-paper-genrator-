name: Build Main App & Separate Admin App APKs

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-apks:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure Android SDK & Accept Licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          sudo chown -R "$USER:$USER" "${SDK_DIR}" || true
          echo "ANDROID_HOME=${SDK_DIR}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${SDK_DIR}" >> "$GITHUB_ENV"
          CMDLINE_BIN="${SDK_DIR}/cmdline-tools/latest/bin"
          if [ -d "${CMDLINE_BIN}" ]; then
            echo "${CMDLINE_BIN}" >> "$GITHUB_PATH"
            yes | "${CMDLINE_BIN}/sdkmanager" --licenses > /dev/null || true
          fi

      - name: Install Gradle 9.3.1
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-9.3.1-bin.zip -o /tmp/gradle.zip
          sudo unzip -q -d /opt /tmp/gradle.zip
          echo "/opt/gradle-9.3.1/bin" >> "$GITHUB_PATH"

      - name: Attach GitHub Repo & Secret API Token into .env
        env:
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          ADMIN_PAT: ${{ secrets.ADMIN_GITHUB_TOKEN }}
        run: |
          cp .env.example .env
          sed -i "s|GITHUB_OWNER=.*|GITHUB_OWNER=${REPO_OWNER}|g" .env
          sed -i "s|GITHUB_REPO=.*|GITHUB_REPO=${REPO_NAME}|g" .env
          if [ -n "${ADMIN_PAT}" ]; then
            sed -i "s|GITHUB_TOKEN=.*|GITHUB_TOKEN=${ADMIN_PAT}|g" .env
          fi

      - name: Restore or Generate debug.keystore for APK signing
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: 1. Build Main User App APK (Paper Maker)
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace
          mkdir -p dist-main
          cp app/build/outputs/apk/debug/*.apk dist-main/Paper-Maker-Main-App.apk

      - name: 2. Build Separate Small Admin Panel App APK (Shami Admin)
        run: |
          gradle :app:assembleDebug -PadminApp=true --no-daemon --stacktrace
          mkdir -p dist-admin
          cp app/build/outputs/apk/debug/*.apk dist-admin/Paper-Maker-Admin-App.apk

      - name: Upload 1. Main User App APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 1-Paper-Maker-Main-User-APK
          path: dist-main/Paper-Maker-Main-App.apk
          if-no-files-found: error

      - name: Upload 2. Separate Admin Panel App APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 2-Shami-Admin-Panel-APK
          path: dist-admin/Paper-Maker-Admin-App.apk
          if-no-files-found: error
