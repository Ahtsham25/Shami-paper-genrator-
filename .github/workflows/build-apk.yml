name: Build Main App & Separate Admin App APKs

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-apks:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure Android SDK & Accept Licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          sudo chown -R "$USER:$USER" "${SDK_DIR}" || true
          echo "ANDROID_HOME=${SDK_DIR}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${SDK_DIR}" >> "$GITHUB_ENV"
          CMDLINE_BIN="${SDK_DIR}/cmdline-tools/latest/bin"
          if [ -d "${CMDLINE_BIN}" ]; then
            echo "${CMDLINE_BIN}" >> "$GITHUB_PATH"
            yes | "${CMDLINE_BIN}/sdkmanager" --licenses > /dev/null || true
          fi

      - name: Install Gradle 9.3.1
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-9.3.1-bin.zip -o /tmp/gradle.zip
          sudo unzip -q -d /opt /tmp/gradle.zip
          echo "/opt/gradle-9.3.1/bin" >> "$GITHUB_PATH"

      - name: Attach GitHub Repo & Secret API Token into .env
        env:
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          ADMIN_PAT: ${{ secrets.ADMIN_GITHUB_TOKEN }}
        run: |
          cp .env.example .env
          sed -i "s|GITHUB_OWNER=.*|GITHUB_OWNER=${REPO_OWNER}|g" .env
          sed -i "s|GITHUB_REPO=.*|GITHUB_REPO=${REPO_NAME}|g" .env
          if [ -n "${ADMIN_PAT}" ]; then
            sed -i "s|GITHUB_TOKEN=.*|GITHUB_TOKEN=${ADMIN_PAT}|g" .env
          fi

      - name: Restore Keystores for Signed Release & Debug APKs
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ -f .github/shami-release-key.base64 ]; then
            base64 -d .github/shami-release-key.base64 > "${GITHUB_WORKSPACE}/my-upload-key.jks"
          else
            keytool -genkeypair -v \
              -keystore "${GITHUB_WORKSPACE}/my-upload-key.jks" \
              -storetype PKCS12 \
              -storepass shamiacademy \
              -alias upload \
              -keypass shamiacademy \
              -keyalg RSA \
              -keysize 2048 \
              -startdate "2024/01/01 00:00:00" \
              -validity 10000 \
              -dname "CN=Shami Academy,OU=Education,O=Shami Academy,L=Lahore,ST=Punjab,C=PK"
          fi

      - name: 1. Build Signed Release Main User App APK (Paper Maker)
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: shamiacademy
          KEY_PASSWORD: shamiacademy
        run: |
          rm -rf app/build/outputs/apk
          gradle :app:assembleRelease -Pkotlin.compiler.execution.strategy=daemon --no-daemon --no-build-cache --no-configuration-cache --stacktrace
          mkdir -p dist-main
          cp app/build/outputs/apk/release/*.apk dist-main/raw-main.apk

          ZIPALIGN_BIN=$(find "${ANDROID_HOME}/build-tools" -name zipalign | sort -V | tail -n 1)
          APKSIGNER_BIN=$(find "${ANDROID_HOME}/build-tools" -name apksigner | sort -V | tail -n 1)
          if [ -n "${ZIPALIGN_BIN}" ]; then
            "${ZIPALIGN_BIN}" -p -f 4 dist-main/raw-main.apk dist-main/Paper-Maker-Main-App.apk
            rm -f dist-main/raw-main.apk
          else
            mv dist-main/raw-main.apk dist-main/Paper-Maker-Main-App.apk
          fi

          if [ -n "${APKSIGNER_BIN}" ]; then
            "${APKSIGNER_BIN}" sign \
              --ks "${KEYSTORE_PATH}" \
              --ks-key-alias upload \
              --ks-pass "pass:${STORE_PASSWORD}" \
              --key-pass "pass:${KEY_PASSWORD}" \
              --min-sdk-version 21 \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              dist-main/Paper-Maker-Main-App.apk
            "${APKSIGNER_BIN}" verify --verbose dist-main/Paper-Maker-Main-App.apk
          fi

      - name: 2. Build Signed Release Separate Admin Panel App APK (Shami Admin)
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: shamiacademy
          KEY_PASSWORD: shamiacademy
        run: |
          rm -rf app/build/outputs/apk
          gradle :app:assembleRelease -PadminApp=true -Pkotlin.compiler.execution.strategy=daemon --no-daemon --no-build-cache --no-configuration-cache --stacktrace
          mkdir -p dist-admin
          cp app/build/outputs/apk/release/*.apk dist-admin/raw-admin.apk

          ZIPALIGN_BIN=$(find "${ANDROID_HOME}/build-tools" -name zipalign | sort -V | tail -n 1)
          APKSIGNER_BIN=$(find "${ANDROID_HOME}/build-tools" -name apksigner | sort -V | tail -n 1)
          if [ -n "${ZIPALIGN_BIN}" ]; then
            "${ZIPALIGN_BIN}" -p -f 4 dist-admin/raw-admin.apk dist-admin/Shami-Admin-Panel-App.apk
            rm -f dist-admin/raw-admin.apk
          else
            mv dist-admin/raw-admin.apk dist-admin/Shami-Admin-Panel-App.apk
          fi

          if [ -n "${APKSIGNER_BIN}" ]; then
            "${APKSIGNER_BIN}" sign \
              --ks "${KEYSTORE_PATH}" \
              --ks-key-alias upload \
              --ks-pass "pass:${STORE_PASSWORD}" \
              --key-pass "pass:${KEY_PASSWORD}" \
              --min-sdk-version 21 \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              dist-admin/Shami-Admin-Panel-App.apk
            "${APKSIGNER_BIN}" verify --verbose dist-admin/Shami-Admin-Panel-App.apk
          fi

      - name: Publish Direct .apk Downloads to GitHub Releases (No .zip required)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="latest"
          gh release delete "${TAG_NAME}" --yes --cleanup-tag 2>/dev/null || true
          gh release create "${TAG_NAME}" \
            dist-main/Paper-Maker-Main-App.apk \
            dist-admin/Shami-Admin-Panel-App.apk \
            --title "Shami Academy Paper Maker & Admin APKs (Direct .apk Download)" \
            --notes "Tap **Paper-Maker-Main-App.apk** or **Shami-Admin-Panel-App.apk** under Assets below to download the direct `.apk` file onto your Android phone (no `.zip` extraction needed)."

      - name: Upload 1. Main User App APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 1-Paper-Maker-Main-User-APK
          path: dist-main/Paper-Maker-Main-App.apk
          if-no-files-found: error

      - name: Upload 2. Separate Admin Panel App APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 2-Shami-Admin-Panel-APK
          path: dist-admin/Shami-Admin-Panel-App.apk
          if-no-files-found: error

      - name: Write Installation Instructions to Summary
        env:
          REPO_FULL: ${{ github.repository }}
        run: |
          echo "## 📲 Direct 1-Click Android `.apk` Downloads (No `.zip` Extraction Needed!)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **[⬇️ Download Paper-Maker-Main-App.apk (Direct .apk)](https://github.com/${REPO_FULL}/releases/download/latest/Paper-Maker-Main-App.apk)**" >> "$GITHUB_STEP_SUMMARY"
          echo "- **[⬇️ Download Shami-Admin-Panel-App.apk (Direct .apk)](https://github.com/${REPO_FULL}/releases/download/latest/Shami-Admin-Panel-App.apk)**" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "---" >> "$GITHUB_STEP_SUMMARY"
          echo "*(Note: If you download from the **Artifacts** section at the very bottom instead of the direct links above, GitHub wraps artifacts in a `.zip` file — you must Extract/Unzip the `.zip` file first before installing, otherwise Android will say \"There was a problem parsing the package\".)*" >> "$GITHUB_STEP_SUMMARY"
